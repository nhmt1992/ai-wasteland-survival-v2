services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-wasteland-v2-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_wasteland_v2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_wasteland_v2"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
